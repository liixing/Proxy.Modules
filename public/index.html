<!doctype html>
<html lang="zh-CN">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Proxy.Modules</title>
        <meta name="description" content="给 Surge、Loon、Egern、Quantumult X 用的模块。Trakt 简体中文，详情页可打开 EplayerX 和 Infuse。" />
        <style>
            :root {
                --bg: #101114;
                --bg-raise: #181b20;
                --ink: #f4f1ea;
                --muted: #aaa49a;
                --line: rgba(244, 241, 234, 0.12);
                --line-strong: rgba(244, 241, 234, 0.28);
                --accent: #e7a15a;
                --shadow: 0 24px 60px rgba(0, 0, 0, 0.28);
                --font: "SF Pro Text", "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Microsoft YaHei", sans-serif;
            }

            * {
                box-sizing: border-box;
            }

            html {
                scroll-behavior: smooth;
                overflow-x: clip;
            }

            body {
                margin: 0;
                min-height: 100vh;
                overflow-x: clip;
                color: var(--ink);
                font-family: var(--font);
                background:
                    radial-gradient(900px 420px at 8% -10%, rgba(231, 161, 90, 0.16), transparent 60%),
                    radial-gradient(700px 380px at 100% 0%, rgba(90, 122, 160, 0.12), transparent 55%),
                    var(--bg);
            }

            a {
                color: inherit;
                text-decoration: none;
            }

            .wrap {
                width: min(1080px, calc(100vw - 40px));
                margin: 0 auto;
            }

            header {
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 16px;
                padding: 22px 0 8px;
            }

            .brand {
                font-size: 15px;
                font-weight: 650;
                letter-spacing: 0.01em;
            }

            .nav {
                display: flex;
                align-items: center;
                gap: 18px;
                color: var(--muted);
                font-size: 14px;
            }

            .nav a:hover {
                color: var(--ink);
            }

            .hero {
                padding: 72px 0 28px;
            }

            .kicker {
                margin: 0 0 14px;
                color: var(--accent);
                font-size: 13px;
                font-weight: 650;
                letter-spacing: 0.06em;
                overflow-wrap: anywhere;
            }

            h1 {
                max-width: 14em;
                margin: 0;
                font-size: clamp(36px, 5vw, 56px);
                font-weight: 640;
                letter-spacing: -0.035em;
                line-height: 1.12;
            }

            .lead {
                max-width: 38em;
                margin: 18px 0 0;
                color: var(--muted);
                font-size: 17px;
                line-height: 1.7;
            }

            .hero-actions {
                display: flex;
                flex-wrap: wrap;
                gap: 10px;
                margin-top: 28px;
            }

            .button {
                display: inline-flex;
                align-items: center;
                justify-content: center;
                min-height: 44px;
                padding: 0 16px;
                border: 1px solid transparent;
                border-radius: 10px;
                font: inherit;
                font-size: 14px;
                font-weight: 620;
            }

            .button.primary {
                background: var(--ink);
                color: #16140f;
            }

            .button.primary:hover {
                background: #fff;
            }

            .button.ghost {
                border-color: var(--line-strong);
                color: var(--ink);
                background: transparent;
            }

            .button.ghost:hover {
                border-color: var(--ink);
            }

            .catalog-head {
                display: flex;
                align-items: baseline;
                justify-content: space-between;
                gap: 16px;
                margin: 36px 0 14px;
            }

            .catalog-head h2 {
                margin: 0;
                font-size: 15px;
                font-weight: 620;
                letter-spacing: 0.04em;
            }

            .catalog-head p {
                margin: 0;
                color: var(--muted);
                font-size: 13px;
            }

            .catalog {
                display: grid;
                grid-template-columns: 1.4fr 1fr;
                gap: 16px;
                padding-bottom: 72px;
            }

            .module-card {
                display: flex;
                flex-direction: column;
                padding: 22px;
                border: 1px solid var(--line);
                border-radius: 18px;
                background: linear-gradient(180deg, rgba(255, 255, 255, 0.035), transparent 42%), var(--bg-raise);
                box-shadow: var(--shadow);
            }

            .module-head {
                display: flex;
                align-items: center;
                gap: 14px;
            }

            .module-icon {
                width: 48px;
                height: 48px;
                flex: 0 0 48px;
                border-radius: 12px;
                object-fit: cover;
                background: #0c0d10;
            }

            .module-card h3 {
                margin: 0;
                font-size: 22px;
                font-weight: 640;
                letter-spacing: -0.03em;
            }

            .module-card p {
                margin: 16px 0 0;
                color: var(--muted);
                font-size: 15px;
                line-height: 1.7;
            }

            .tool-grid {
                display: grid;
                grid-template-columns: repeat(4, minmax(0, 1fr));
                gap: 8px;
                margin-top: auto;
                padding-top: 22px;
            }

            .tool-link {
                display: flex;
                align-items: center;
                justify-content: center;
                min-height: 42px;
                border: 1px solid var(--line);
                border-radius: 10px;
                background: rgba(16, 17, 20, 0.45);
                font-size: 14px;
                font-weight: 620;
            }

            .tool-link:hover {
                border-color: var(--accent);
                color: var(--accent);
            }

            .card-links {
                display: flex;
                margin-top: 12px;
            }

            .card-links a {
                color: var(--muted);
                font-size: 13px;
            }

            .card-links a:hover {
                color: var(--ink);
            }

            @media (max-width: 800px) {
                .wrap {
                    width: calc(100vw - 32px);
                }

                .kicker {
                    font-size: 12px;
                    letter-spacing: 0.02em;
                }

                header {
                    gap: 12px;
                }

                .nav {
                    gap: 14px;
                    font-size: 13px;
                }

                .hero {
                    padding: 36px 0 12px;
                }

                h1 {
                    font-size: 34px;
                }

                .catalog {
                    grid-template-columns: 1fr;
                }

                .catalog-head {
                    align-items: flex-start;
                    flex-direction: column;
                    gap: 6px;
                }

                .tool-grid {
                    grid-template-columns: repeat(2, minmax(0, 1fr));
                }
            }
        </style>
    </head>
    <body>
        <div class="wrap">
            <header>
                <a class="brand" href="/">Proxy.Modules</a>
                <nav class="nav">
                    <a href="/admin">翻译管理</a>
                    <a href="https://github.com/liixing/Proxy.Modules" target="_blank" rel="noreferrer">GitHub</a>
                </nav>
            </header>

            <section class="hero">
                <p class="kicker">SURGE · LOON · EGERN · QUANTUMULT X</p>
                <h1>Trakt 换成简体中文，<br />详情页打开播放器。</h1>
                <p class="lead">给代理工具用的模块。补上中文标题、简介和海报，把观看记录按电视剧合并，并从 Trakt、SofaTime 跳到 EplayerX 和 Infuse。</p>
                <div class="hero-actions">
                    <a
                        class="button primary"
                        href="http://boxjs.com/#/sub/add/https%3A%2F%2Fraw.githubusercontent.com%2Fliixing%2FProxy.Modules%2Fmain%2Fboxjs.json"
                        target="_blank"
                        rel="noreferrer"
                        >订阅到 BoxJs</a
                    >
                    <a class="button ghost" href="https://github.com/liixing/Proxy.Modules" target="_blank" rel="noreferrer">查看仓库</a>
                </div>
            </section>

            <div class="catalog-head" id="catalog">
                <h2>模块</h2>
                <p>点客户端名称即可安装</p>
            </div>
            <section class="catalog" id="module-list"></section>
        </div>

        <script>
            const tools = {
                loon: {
                    id: "loon",
                    name: "Loon",
                    buildImportUrl(resourceUrl) {
                        return `https://www.nsloon.com/openloon/import?plugin=${encodeURIComponent(resourceUrl)}`;
                    },
                },
                surge: {
                    id: "surge",
                    name: "Surge",
                    buildImportUrl(resourceUrl) {
                        return `surge:///install-module?url=${encodeURIComponent(resourceUrl)}`;
                    },
                },
                egern: {
                    id: "egern",
                    name: "Egern",
                    buildImportUrl(resourceUrl, moduleItem) {
                        return `egern:/modules/new?name=${encodeURIComponent(moduleItem.name)}&url=${encodeURIComponent(resourceUrl)}`;
                    },
                },
                qx: {
                    id: "qx",
                    name: "QX",
                    buildImportUrl(resourceUrl, moduleItem) {
                        const payload = {
                            rewrite_remote: [`${resourceUrl}, tag=${moduleItem.qxTag}, enabled=true`],
                        };
                        return `https://quantumult.app/x/open-app/add-resource?remote-resource=${encodeURIComponent(JSON.stringify(payload))}`;
                    },
                },
            };

            const modules = [
                {
                    id: "trakt_simplified_chinese",
                    name: "Trakt 增强",
                    description:
                        "Trakt App 各页面从英文改为简体中文，支持中文标题、简介和海报；历史页面剧集类别的已观看记录按电视剧合并；Trakt 和 SofaTime 的影片详情页添加 EplayerX、Infuse 跳转按钮；部分兼容其它使用了 Trakt API 的应用。",
                    qxTag: "Trakt Simplified Chinese",
                    icon: "https://raw.githubusercontent.com/liixing/Proxy.Modules/main/trakt_simplified_chinese/images/trakt.webp",
                    githubFolder: "https://github.com/liixing/Proxy.Modules/tree/main/trakt_simplified_chinese",
                    resources: {
                        loon: "https://raw.githubusercontent.com/liixing/Proxy.Modules/main/trakt_simplified_chinese/trakt_simplified_chinese.plugin",
                        surge: "https://raw.githubusercontent.com/liixing/Proxy.Modules/main/trakt_simplified_chinese/trakt_simplified_chinese.sgmodule",
                        egern: "https://raw.githubusercontent.com/liixing/Proxy.Modules/main/trakt_simplified_chinese/trakt_simplified_chinese.plugin",
                        qx: "https://raw.githubusercontent.com/liixing/Proxy.Modules/main/trakt_simplified_chinese/trakt_simplified_chinese.snippet",
                    },
                },
                {
                    id: "imdbapi_redirect_to_tiffara",
                    name: "修复 imdbapi.dev",
                    description: "把 imdbapi.dev 及其子域名转到 tiffara.com，路径和查询参数保持不变。",
                    qxTag: "修复 imdbapi.dev",
                    icon: "https://raw.githubusercontent.com/liixing/Proxy.Modules/main/imdbapi_redirect_to_tiffara/imdb.png",
                    githubFolder: "https://github.com/liixing/Proxy.Modules/tree/main/imdbapi_redirect_to_tiffara",
                    resources: {
                        loon: "https://raw.githubusercontent.com/liixing/Proxy.Modules/main/imdbapi_redirect_to_tiffara/imdbapi_redirect_to_tiffara.plugin",
                        surge: "https://raw.githubusercontent.com/liixing/Proxy.Modules/main/imdbapi_redirect_to_tiffara/imdbapi_redirect_to_tiffara.sgmodule",
                        egern: "https://raw.githubusercontent.com/liixing/Proxy.Modules/main/imdbapi_redirect_to_tiffara/imdbapi_redirect_to_tiffara.plugin",
                        qx: "https://raw.githubusercontent.com/liixing/Proxy.Modules/main/imdbapi_redirect_to_tiffara/imdbapi_redirect_to_tiffara.snippet",
                    },
                },
            ];

            function findResource(moduleItem, toolId) {
                return moduleItem?.resources ? moduleItem.resources[toolId] : "";
            }

            function buildImportUrl(moduleItem, toolId) {
                const tool = tools[toolId];
                const resourceUrl = findResource(moduleItem, toolId);
                if (!tool || !resourceUrl) {
                    return "#";
                }
                return tool.buildImportUrl(resourceUrl, moduleItem);
            }

            function escapeHtml(value) {
                return String(value).replace(/[&<>"']/g, (char) => {
                    const map = {
                        "&": "&amp;",
                        "<": "&lt;",
                        ">": "&gt;",
                        '"': "&quot;",
                        "'": "&#39;",
                    };
                    return map[char] || char;
                });
            }

            function renderModuleCard(moduleItem) {
                const toolCards = ["surge", "loon", "egern", "qx"]
                    .map((toolId) => {
                        const tool = tools[toolId];
                        const importUrl = buildImportUrl(moduleItem, toolId);
                        return `<a class="tool-link" href="${importUrl}">${tool.name}</a>`;
                    })
                    .join("");

                return `
        <article class="module-card">
          <div class="module-head">
            <img class="module-icon" src="${escapeHtml(moduleItem.icon)}" alt="">
            <h3>${escapeHtml(moduleItem.name)}</h3>
          </div>
          <p>${escapeHtml(moduleItem.description || "")}</p>
          <div class="tool-grid">${toolCards}</div>
          <div class="card-links">
            <a href="${moduleItem.githubFolder}" target="_blank" rel="noreferrer">查看代码</a>
          </div>
        </article>`;
            }

            function renderModules() {
                const list = document.getElementById("module-list");
                list.innerHTML = modules.map(renderModuleCard).join("");
            }
            renderModules();
        </script>
    </body>
</html>
