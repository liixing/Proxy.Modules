compatibility_flags = ["nodejs_compat"]

[assets]
directory = "public"
binding = "ASSETS"
run_worker_first = ["/api/*", "/admin", "/admin/"]

[[kv_namespaces]]
binding = "TRAKT_CACHE"
id = "0c9a0c6be2a24de38f3fdcc3e5237417"
